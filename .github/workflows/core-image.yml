# Builds the NBO core image on every push to main and publishes it to GitHub's
# container registry, so `docker compose up -d` pulls it instead of building
# for 10 to 15 minutes on the server. Runs in the public nbo-core repository
# (it does nothing in the private source repository, which uses GitLab CI).
#
# Tags: `latest` (what compose.yaml pulls), the release tag when the commit has one
# (v2026.11.19, also built in as NBO_VERSION) and `sha-<first 12 characters of the
# commit>` (what NBO_IMAGE pins to roll back). The package's visibility is set
# to Public once, by hand, in the package settings on GitHub.
name: Core image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: core-image
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Image name and tags
        id: meta
        run: |
          set -eu
          owner="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          name="ghcr.io/${owner}/nbo-core"
          tags="${name}:latest,${name}:sha-${GITHUB_SHA::12}"
          # The release tag on this commit (export-core --sync pushes it with the branch, atomically).
          release="$(git ls-remote --tags origin 'refs/tags/v*' | awk -v sha="$GITHUB_SHA" '$1 == sha { sub("refs/tags/", "", $2); print $2 }' | sort -V | tail -n 1)"
          if [ -n "$release" ]; then
            tags="${tags},${name}:${release}"
            version="$release"
          else
            version="sha-${GITHUB_SHA::12}"
          fi
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: NBO_VERSION=${{ steps.meta.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=FSL-1.1-ALv2
          cache-from: type=gha
          cache-to: type=gha,mode=max
