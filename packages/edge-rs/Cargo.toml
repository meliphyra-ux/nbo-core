[package]
name = "nbo-edge"
version = "0.1.0"
license = "FSL-1.1-ALv2"
edition = "2024"
rust-version = "1.96"
publish = false
description = "NBO's edge: weighted, sticky reverse proxy in front of every site"

[[bin]]
name = "nbo-edge"
path = "src/main.rs"

[lib]
name = "nbo_edge"
path = "src/lib.rs"

[dependencies]
async-compression = { version = "=0.4.52", features = ["tokio", "gzip", "zlib", "deflate", "brotli"] }
bytes = "=1.12.1"
futures-core = "=0.3.34"
http = "=1.5.0"
http-body-util = "=0.1.5"
hyper = { version = "=1.12.0", features = ["client", "server", "http1", "http2"] }
hyper-rustls = { version = "=0.27.10", default-features = false, features = ["http1", "tls12", "ring"] }
hyper-util = { version = "=0.1.21", features = ["client-legacy", "http1", "tokio"] }
indexmap = "=2.14.2"
ipnet = "=2.12.2"
rand = "=0.10.3"
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = { version = "=1.15.1", features = ["std"] }
serde_json = { version = "=1.0.154", features = ["float_roundtrip", "preserve_order"] }
sha2 = "=0.11.1"
socket2 = "=0.6.5"
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "net", "time", "macros", "sync", "io-util"] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring", "tls12"] }
tokio-util = { version = "=0.7.20", features = ["io"] }
url = "=2.5.8"
webpki-roots = "=1.0.11"

[dev-dependencies]
brotli = "=9.1.1"
flate2 = "=1.1.11"
rcgen = { version = "=0.14.10", default-features = false, features = ["ring", "pem"] }
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "net", "time", "macros", "sync", "test-util", "io-util"] }
